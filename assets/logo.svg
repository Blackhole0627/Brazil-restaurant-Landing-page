<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 100" role="img" aria-label="Parrilla Secreta">
  <defs>
    <linearGradient id="flameL" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#b7281c"/>
      <stop offset="0.5" stop-color="#a02a26"/>
      <stop offset="1" stop-color="#ffcf5c"/>
    </linearGradient>
    <linearGradient id="ringL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffcf5c"/>
      <stop offset="0.5" stop-color="#f7b733"/>
      <stop offset="1" stop-color="#a02a26"/>
    </linearGradient>
  </defs>

  <!-- Emblem (scaled mark) -->
  <g transform="translate(50 50) scale(0.72)">
    <circle r="54" fill="none" stroke="url(#ringL)" stroke-width="3"/>
    <circle r="47" fill="none" stroke="#a02a26" stroke-width="1.2" opacity="0.55"/>
    <g stroke="#f7b733" stroke-width="2.4" stroke-linecap="round" opacity="0.85">
      <line x1="-20" y1="26" x2="20" y2="-20"/>
      <line x1="20" y1="26" x2="-20" y2="-20"/>
    </g>
    <circle cx="20" cy="-20" r="2.6" fill="#f7b733"/>
    <circle cx="-20" cy="-20" r="2.6" fill="#f7b733"/>
    <path d="M0 -32 C14 -14, 18 -2, 12 10 C8 19, 2 22, 0 32 C-2 22, -8 19, -12 10 C-18 -2, -14 -14, 0 -32 Z" fill="url(#flameL)"/>
    <path d="M0 -14 C8 -4, 12 3, 8 12 C5 18, 1 20, 0 26 C-1 20, -5 18, -8 12 C-12 3, -8 -4, 0 -14 Z" fill="#ffe08a" opacity="0.9"/>
    <g stroke="#f7b733" stroke-width="3" stroke-linecap="round">
      <line x1="-15" y1="39" x2="15" y2="39"/>
      <line x1="-11" y1="45" x2="11" y2="45"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g font-family="'Bebas Neue','Oswald','Arial Narrow',Impact,sans-serif" font-weight="700">
    <text x="106" y="48" font-size="40" letter-spacing="3" fill="#f4ede4">PARRILLA</text>
    <text x="106" y="82" font-size="40" letter-spacing="3" fill="#a02a26">SECRETA</text>
  </g>
  <!-- Tagline -->
  <text x="108" y="95" font-family="'Inter',Arial,sans-serif" font-size="8.5" letter-spacing="4.5" fill="#cabfb2">A S A D O · F O G O · B R A S A</text>
</svg>
